name: Karrily CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job for Frontend
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Security Audit
        run: cd frontend && npm audit --audit-level=critical || true

      - name: Linting
        run: cd frontend && npm run lint

      - name: Run Tests
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build

  # Job for Backend
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Security Audit
        run: cd backend && npm audit --audit-level=critical || true

      - name: Linting
        run: cd backend && npm run lint

      - name: Run Tests
        run: cd backend && npm run test

      - name: Build
        run: cd backend && npm run build
