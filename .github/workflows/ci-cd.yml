name: Karrily CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Static Check (Linting)
        run: npm run lint
        continue-on-error: true

      - name: Build & Type Check
        run: npm run build 

      - name: Dynamic Tests
        run: npm run test
        continue-on-error: true

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Static Check (Linting)
        run: npm run lint
        continue-on-error: true

      - name: Dynamic Tests
        run: npm run test
        continue-on-error: true

      - name: Build & Type Check
        run: npm run build
